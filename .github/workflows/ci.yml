name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # A macOS runner covers both stacks: Swift needs it, and the WinForms project
    # compiles here too thanks to EnableWindowsTargeting (it just cannot run).
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show toolchain versions
        run: |
          dotnet --version
          swift --version

      - name: Build .NET
        run: dotnet build Wording.slnx -c Release

      - name: Test .NET
        run: dotnet test -c Release --no-build

      - name: Build Swift
        run: swift build --package-path macos -c release

      - name: Test Swift
        run: swift test --package-path macos

      - name: Assemble the macOS app bundle
        # Catches packaging regressions that trap at launch rather than at build time.
        run: VERSION=0.0.0-ci ./macos/build-app.sh

      - name: Verify the app bundle is complete
        run: |
          APP=macos/build/Wording.app
          test -x "$APP/Contents/MacOS/Wording" || { echo "executable missing from the app"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "Info.plist missing from the app"; exit 1; }
          # A bare executable has no bundle identifier and UNUserNotificationCenter
          # traps, so this key is what makes notifications possible at all.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
